<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Drift - Ultra Hard Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stat">SKOR: <span id="score-val">0</span></div>
            <div class="stat">KECEPATAN: <span id="speed-val">1.0</span>x</div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="750"></canvas>
        
        <div id="overlay" class="visible">
            <h1 id="title">VELOCITY DRIFT</h1>
            <p id="desc">Gunakan panah <b>KIRI / KANAN</b> untuk bermanuver. Fisika pesawat sangat licin. Hindari balok merah!</p>
            <button id="start-btn">MULAI MODE EKSTREM</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
