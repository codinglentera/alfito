<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hexagon - Hard Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div id="score-board">SKOR: <span id="score-val">0</span></div>
            <div id="level-board">LEVEL: <span id="level-val">1</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="overlay" class="visible">
            <h1 id="game-title">CYBER HEXAGON</h1>
            <p id="game-desc">Gunakan panah <b>KIRI / KANAN</b> untuk berputar. Hindari dinding segi enam yang menyusut!</p>
            <button id="start-btn">MULAI PERMAINAN</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
