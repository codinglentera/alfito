<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomba Ketik Kilat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Bagian Atas: Status Informasi -->
        <div class="header-status">
            <div class="status-box">Waktu: <span id="waktu-val">10</span>s</div>
            <div class="status-box">Skor: <span id="skor-val">0</span></div>
        </div>

        <!-- Bagian Tengah: Kata yang Harus Diketik -->
        <div class="word-section">
            <p id="instruksi">Ketik kata di bawah ini:</p>
            <h1 id="kata-target">mulai</h1>
        </div>

        <!-- Bagian Bawah: Input Kotak Teks -->
        <div class="input-section">
            <input type="text" id="input-kata" placeholder="Ketik di sini..." autocomplete="off" autofocus>
        </div>

        <!-- Lapisan Layar Game Over / Mulai -->
        <div id="overlay" class="visible">
            <h1 id="overlay-title">LOMBA KETIK KILAT</h1>
            <p id="overlay-desc">Tulis kata yang muncul secepat mungkin sebelum waktu habis!</p>
            <button id="start-btn">MULAI LOMBA</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
